name: release

# main에 push되면 테스트를 돌리고, 마지막 배포 태그 이후 플러그인 파일이 바뀐 커밋이 있을 때만
# plugin.json 버전을 올리고 CHANGELOG.md·태그·GitHub Release를 만든다.
# Claude Code는 plugin.json 버전이 바뀌어야 설치한 사람에게 업데이트를 내려보낸다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 배포가 겹치면 버전이 두 번 올라가므로 한 번에 하나만 돈다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 배포 커밋이 다시 배포를 부르지 않게 한다. GITHUB_TOKEN으로 한 push는 원래 워크플로를 다시 띄우지 않지만 한 번 더 막는다.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 테스트
        run: npm test

      - name: 배포 계획과 파일 갱신
        id: release
        run: node tools/release.mjs apply --github-output

      - name: 배포 커밋·태그·릴리스
        if: steps.release.outputs.releasable == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): product-planning v${VERSION}"
          git tag -a "$TAG" -m "product-planning v${VERSION}"
          git push origin HEAD:main "$TAG"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "product-planning v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
